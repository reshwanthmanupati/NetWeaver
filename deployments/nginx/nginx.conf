# ============================================================================
# NetWeaver Production Nginx Reverse Proxy
# ============================================================================
# Features:
#   - TLS 1.2/1.3 termination with Let's Encrypt
#   - HTTP → HTTPS redirect
#   - Rate limiting at edge
#   - Security headers
#   - WebSocket upgrade support
#   - Gzip compression
#   - Static file caching for Web UI
#   - Upstream load balancing ready
# ============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance ────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    client_max_body_size 10m;
    server_tokens off;  # Hide nginx version

    # ── Gzip Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── Rate Limiting Zones ───────────────────────────────────────────────
    # General API: 30 requests/sec per IP
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    # Login: 5 requests/min per IP (brute force protection)
    limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/m;
    # WebSocket: 10 connections per IP
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    # ── Upstream Backends ─────────────────────────────────────────────────
    upstream api_gateway {
        server api-gateway:8080;
        # For horizontal scaling, add more servers:
        # server api-gateway-2:8080;
        keepalive 32;
    }

    upstream web_ui {
        server web-ui:80;
        keepalive 16;
    }

    # ── Map for WebSocket Upgrade ─────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ── HTTP → HTTPS Redirect ─────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Server ──────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name netweaver.example.com;  # CHANGE: Set your domain

        # ── TLS Configuration ─────────────────────────────────────────────
        # Let's Encrypt certificates (use certbot to obtain)
        ssl_certificate /etc/letsencrypt/live/netweaver.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/netweaver.example.com/privkey.pem;

        # Strong TLS settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # Session cache/tickets
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # DH parameters (generate: openssl dhparam -out /etc/nginx/dhparam.pem 2048)
        # ssl_dhparam /etc/nginx/dhparam.pem;

        # ── Security Headers ──────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss://$host ws://$host" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

        # ── API Gateway Proxy ─────────────────────────────────────────────
        # Login endpoint - strict rate limiting
        location /api/v1/auth/login {
            limit_req zone=api_login burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # All other API routes
        location /api/ {
            limit_req zone=api_general burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;

            # Don't buffer API responses
            proxy_buffering off;
        }

        # Health check (no rate limiting)
        location /health {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            access_log off;
        }

        # API docs (Swagger/ReDoc)
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
        }

        # ── WebSocket Proxy ───────────────────────────────────────────────
        location /ws {
            limit_conn ws_conn 10;

            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;  # 24h for long-lived WS
            proxy_send_timeout 86400s;
        }

        # ── Web UI (React Static Files) ──────────────────────────────────
        location / {
            proxy_pass http://web_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache static assets aggressively
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                proxy_pass http://web_ui;
                expires 30d;
                add_header Cache-Control "public, immutable";
            }
        }

        # ── Block sensitive paths ─────────────────────────────────────────
        location ~ /\. {
            deny all;
            return 404;
        }

        location ~ ^/(\.env|\.git|docker-compose|Dockerfile) {
            deny all;
            return 404;
        }
    }

    # ── Development Server (HTTP only, no TLS) ────────────────────────────
    # Uncomment for local development without certificates
    # server {
    #     listen 80;
    #     server_name localhost;
    #
    #     location /api/ {
    #         proxy_pass http://api_gateway;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     }
    #
    #     location /ws {
    #         proxy_pass http://api_gateway;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection $connection_upgrade;
    #     }
    #
    #     location / {
    #         proxy_pass http://web_ui;
    #     }
    # }
}
